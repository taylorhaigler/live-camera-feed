<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Camera Feed</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0e0f12;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8e8ec;
  }
  .app {
    width: min(900px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .live-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff3b30;
    box-shadow: 0 0 0 0 rgba(255,59,48,0.6);
    animation: pulse 1.6s infinite;
  }
  .live-dot.off {
    background: #555;
    animation: none;
    box-shadow: none;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,59,48,0.6); }
    70% { box-shadow: 0 0 0 10px rgba(255,59,48,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); }
  }
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #23242a;
  }
  body.fs-mode {
    overflow: hidden;
  }
  body.fs-mode .app > h1,
  body.fs-mode .app > div:last-child {
    display: none;
  }
  body.fs-mode .app {
    width: 100vw;
    max-width: 100vw;
    gap: 0;
  }
  body.fs-mode .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    border-radius: 0;
    border: none;
    z-index: 1000;
  }
  body.fs-mode .stage video {
    object-fit: contain;
  }
  body.fs-mode .controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1001;
    margin: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
  }
  .exit-fs {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1002;
    display: none;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    font-size: 1rem;
    line-height: 1;
  }
  body.fs-mode .exit-fs {
    display: flex;
  }
  body.fs-mode .badge,
  body.fs-mode .clock {
    top: calc(12px + env(safe-area-inset-top));
  }
  body.fs-mode .exit-fs {
    top: calc(12px + env(safe-area-inset-top));
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  video.mirror {
    transform: scaleX(-1); /* mirror the front camera so it feels natural */
  }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: #8b8d96;
    text-align: center;
    padding: 24px;
  }
  .badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.02em;
  }
  .clock {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  button, select {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid #2b2c33;
    background: #1a1b20;
    color: #e8e8ec;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  button:hover:not(:disabled), select:hover {
    background: #23242b;
    border-color: #3a3b44;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button.primary {
    background: #2f6fed;
    border-color: #2f6fed;
  }
  button.primary:hover:not(:disabled) {
    background: #4a80f0;
  }
  button.active {
    background: #2f6fed;
    border-color: #2f6fed;
  }
  button.active:hover:not(:disabled) {
    background: #4a80f0;
  }
  button.danger {
    background: #3a1f1f;
    border-color: #5a2a2a;
  }
  button.danger:hover:not(:disabled) {
    background: #4a2626;
  }
  .spacer { flex: 1; }
  .status {
    font-size: 0.85rem;
    color: #8b8d96;
    min-height: 1.2em;
  }
  .snapshots {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
  .snapshots img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #23242a;
    cursor: pointer;
  }
  .snap-row-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .snap-row-header h2 {
    font-size: 0.95rem;
    color: #b7b9c2;
    margin: 0;
    font-weight: 600;
  }
  a.link-btn {
    font-size: 0.8rem;
    color: #8b8d96;
    text-decoration: none;
  }
  a.link-btn:hover { color: #e8e8ec; }

  .panel {
    display: none;
    flex-direction: column;
    gap: 12px;
    background: #15161b;
    border: 1px solid #23242a;
    border-radius: 12px;
    padding: 14px;
  }
  .panel.open { display: flex; }
  .preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .preset-row button {
    padding: 6px 12px;
    font-size: 0.8rem;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-row label {
    width: 90px;
    flex-shrink: 0;
    font-size: 0.85rem;
    color: #b7b9c2;
  }
  .slider-row input[type="range"] {
    flex: 1;
    accent-color: #2f6fed;
  }
  .slider-row .value {
    width: 46px;
    flex-shrink: 0;
    text-align: right;
    font-size: 0.8rem;
    color: #8b8d96;
    font-variant-numeric: tabular-nums;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: #15161b;
    border: 1px solid #23242a;
    border-radius: 16px;
    padding: 20px;
    width: min(560px, 100%);
    max-height: 90vh;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal h3 {
    margin: 0;
    font-size: 1rem;
  }
  .mix-canvas-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  .mix-canvas-wrap canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
</style>
</head>
<body>
  <div class="app">
    <h1><span id="liveDot" class="live-dot off"></span> Live Camera Feed</h1>

    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="crownCanvas" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none;"></canvas>
      <div class="placeholder" id="placeholder">
        <div>📷</div>
        <div>Camera is off. Click "Start Camera" to go live.</div>
      </div>
      <div class="badge" id="liveBadge" style="display:none;">● LIVE</div>
      <div class="clock" id="clock" style="display:none;">--:--:--</div>
      <button class="exit-fs" id="exitFsBtn" title="Exit fullscreen">✕</button>
    </div>

    <div class="controls">
      <button class="primary" id="startBtn">Start Camera</button>
      <button class="danger" id="stopBtn" disabled>Stop</button>
      <button id="flipBtn" disabled>🔄 Flip Camera</button>
      <select id="cameraSelect" disabled></select>
      <button id="snapBtn" disabled>📸 Snapshot</button>
      <button id="fullscreenBtn" disabled>⛶ Fullscreen</button>
      <button id="rotateBtn" disabled>⟳ Rotate</button>
      <button id="adjustBtn" disabled>🎨 Colors</button>
      <button id="mixBtn" disabled>🔀 Mix Cameras</button>
      <button id="crownBtn" disabled>👑 Flower Crown</button>
      <div class="spacer"></div>
      <span class="status" id="status"></span>
    </div>

    <div class="panel" id="adjustPanel">
      <div class="preset-row">
        <button data-preset="normal">Normal</button>
        <button data-preset="grayscale">Grayscale</button>
        <button data-preset="sepia">Sepia</button>
        <button data-preset="invert">Invert</button>
        <button data-preset="vivid">Vivid</button>
        <button data-preset="warm">Warm</button>
        <button data-preset="cool">Cool</button>
        <div class="spacer"></div>
        <button id="resetFiltersBtn">Reset</button>
      </div>
      <div class="slider-row">
        <label for="brightnessSlider">Brightness</label>
        <input type="range" id="brightnessSlider" min="50" max="150" value="100">
        <span class="value" id="brightnessValue">100%</span>
      </div>
      <div class="slider-row">
        <label for="contrastSlider">Contrast</label>
        <input type="range" id="contrastSlider" min="50" max="150" value="100">
        <span class="value" id="contrastValue">100%</span>
      </div>
      <div class="slider-row">
        <label for="saturateSlider">Saturation</label>
        <input type="range" id="saturateSlider" min="0" max="200" value="100">
        <span class="value" id="saturateValue">100%</span>
      </div>
      <div class="slider-row">
        <label for="hueSlider">Hue</label>
        <input type="range" id="hueSlider" min="-180" max="180" value="0">
        <span class="value" id="hueValue">0°</span>
      </div>
    </div>

    <div>
      <div class="snap-row-header">
        <h2>Snapshots <span style="font-weight:400; color:#8b8d96;">(tap a photo to save it)</span></h2>
        <div style="display:flex; gap:14px;">
          <a href="#" class="link-btn" id="saveAllBtn">Save all to Photos</a>
          <a href="#" class="link-btn" id="clearSnaps">Clear all</a>
        </div>
      </div>
      <div class="snapshots" id="snapshots"></div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="mixOverlay">
    <div class="modal">
      <h3>Mix Front &amp; Back Camera</h3>
      <div class="status" id="mixStatus">Capturing…</div>
      <div class="mix-canvas-wrap"><canvas id="mixCanvas"></canvas></div>
      <select id="mixLayoutSelect" style="display:none;">
        <option value="crossfade">Crossfade</option>
        <option value="sidebyside">Side by Side</option>
        <option value="pip">Picture-in-Picture</option>
      </select>
      <div class="slider-row" id="mixBlendRow" style="display:none;">
        <label for="mixBlendSlider">Blend</label>
        <input type="range" id="mixBlendSlider" min="0" max="100" value="50">
        <span class="value" id="mixBlendValue">50%</span>
      </div>
      <div class="modal-actions">
        <button id="mixCancelBtn">Cancel</button>
        <button class="primary" id="mixSaveBtn" style="display:none;">Save to Snapshots</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const video = document.getElementById('video');
  const placeholder = document.getElementById('placeholder');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const snapBtn = document.getElementById('snapBtn');
  const flipBtn = document.getElementById('flipBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const exitFsBtn = document.getElementById('exitFsBtn');
  const stage = document.getElementById('stage');
  const cameraSelect = document.getElementById('cameraSelect');
  const statusEl = document.getElementById('status');
  const liveDot = document.getElementById('liveDot');
  const liveBadge = document.getElementById('liveBadge');
  const clockEl = document.getElementById('clock');
  const snapshotsEl = document.getElementById('snapshots');
  const clearSnapsBtn = document.getElementById('clearSnaps');
  const saveAllBtn = document.getElementById('saveAllBtn');

  const rotateBtn = document.getElementById('rotateBtn');
  const adjustBtn = document.getElementById('adjustBtn');
  const adjustPanel = document.getElementById('adjustPanel');
  const resetFiltersBtn = document.getElementById('resetFiltersBtn');
  const brightnessSlider = document.getElementById('brightnessSlider');
  const contrastSlider = document.getElementById('contrastSlider');
  const saturateSlider = document.getElementById('saturateSlider');
  const hueSlider = document.getElementById('hueSlider');
  const brightnessValue = document.getElementById('brightnessValue');
  const contrastValue = document.getElementById('contrastValue');
  const saturateValue = document.getElementById('saturateValue');
  const hueValue = document.getElementById('hueValue');

  const mixBtn = document.getElementById('mixBtn');
  const mixOverlay = document.getElementById('mixOverlay');
  const mixStatus = document.getElementById('mixStatus');
  const mixCanvas = document.getElementById('mixCanvas');
  const mixLayoutSelect = document.getElementById('mixLayoutSelect');
  const mixBlendRow = document.getElementById('mixBlendRow');
  const mixBlendSlider = document.getElementById('mixBlendSlider');
  const mixBlendValue = document.getElementById('mixBlendValue');
  const mixCancelBtn = document.getElementById('mixCancelBtn');
  const mixSaveBtn = document.getElementById('mixSaveBtn');

  const crownBtn = document.getElementById('crownBtn');
  const crownCanvas = document.getElementById('crownCanvas');

  let currentStream = null;
  let clockInterval = null;
  let currentFacingMode = 'user';
  let multipleCamerasAvailable = false;
  let rotation = 0;
  let filterState = { brightness: 100, contrast: 100, saturate: 100, hue: 0, grayscale: 0, sepia: 0, invert: 0 };
  let mixShots = { front: null, back: null };

  let crownEnabled = false;
  let crownRafId = null;
  let faceLandmarker = null;
  let faceLandmarkerLoading = null;
  let lastFaceLandmarks = null;

  const FILTER_PRESETS = {
    normal:    { brightness: 100, contrast: 100, saturate: 100, hue: 0,   grayscale: 0,   sepia: 0,   invert: 0 },
    grayscale: { brightness: 105, contrast: 110, saturate: 100, hue: 0,   grayscale: 100, sepia: 0,   invert: 0 },
    sepia:     { brightness: 100, contrast: 100, saturate: 100, hue: 0,   grayscale: 0,   sepia: 100, invert: 0 },
    invert:    { brightness: 100, contrast: 100, saturate: 100, hue: 0,   grayscale: 0,   sepia: 0,   invert: 100 },
    vivid:     { brightness: 105, contrast: 115, saturate: 160, hue: 0,   grayscale: 0,   sepia: 0,   invert: 0 },
    warm:      { brightness: 105, contrast: 105, saturate: 120, hue: -12, grayscale: 0,   sepia: 12,  invert: 0 },
    cool:      { brightness: 100, contrast: 108, saturate: 110, hue: 15,  grayscale: 0,   sepia: 0,   invert: 0 }
  };

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.style.color = isError ? '#ff6b6b' : '#8b8d96';
  }

  function setLiveUI(isLive) {
    liveDot.classList.toggle('off', !isLive);
    liveBadge.style.display = isLive ? 'flex' : 'none';
    clockEl.style.display = isLive ? 'block' : 'none';
    placeholder.style.display = isLive ? 'none' : 'flex';
    startBtn.disabled = isLive;
    stopBtn.disabled = !isLive;
    snapBtn.disabled = !isLive;
    flipBtn.disabled = !isLive;
    fullscreenBtn.disabled = !isLive;
    rotateBtn.disabled = !isLive;
    adjustBtn.disabled = !isLive;
    crownBtn.disabled = !isLive;
    cameraSelect.disabled = !isLive || !multipleCamerasAvailable;
    updateMixBtnState();
    if (!isLive) {
      exitFullscreenMode();
      adjustPanel.classList.remove('open');
      stopCrownLoop();
    } else if (crownEnabled) {
      resizeCrownCanvas();
      if (!crownRafId) crownRafId = requestAnimationFrame(crownLoop);
    }
  }

  function updateMixBtnState() {
    mixBtn.disabled = !currentStream || !multipleCamerasAvailable;
  }

  // --- Flower crown face tracking ---
  // Loads Google's MediaPipe FaceLandmarker model on first use (lazily, from
  // their CDN) so the app stays a single static HTML file with no build step.
  async function ensureFaceLandmarker() {
    if (faceLandmarker) return faceLandmarker;
    if (faceLandmarkerLoading) return faceLandmarkerLoading;
    faceLandmarkerLoading = (async () => {
      const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
      const filesetResolver = await vision.FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
      );
      faceLandmarker = await vision.FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath:
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numFaces: 1
      });
      return faceLandmarker;
    })();
    return faceLandmarkerLoading;
  }

  function resizeCrownCanvas() {
    const rect = stage.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    crownCanvas.width = Math.max(1, Math.round(rect.width * dpr));
    crownCanvas.height = Math.max(1, Math.round(rect.height * dpr));
  }

  // reproduces the video element's object-fit mapping so landmark coordinates
  // (normalized to the raw video frame) line up with what's actually displayed
  function computeVideoMapping(canvasW, canvasH, videoW, videoH, fit) {
    const scaleX = canvasW / videoW;
    const scaleY = canvasH / videoH;
    const scale = fit === 'contain' ? Math.min(scaleX, scaleY) : Math.max(scaleX, scaleY);
    return { scale, offsetX: (canvasW - videoW * scale) / 2, offsetY: (canvasH - videoH * scale) / 2 };
  }

  function drawFlowerCrown(ctx, cx, cy, faceWidthPx, angle) {
    const flowers = ['🌸', '🌸', '🌸', '🌸', '🌸', '🌸', '🌸'];
    const radius = faceWidthPx * 0.42;
    const fontSize = Math.max(14, faceWidthPx * 0.22);
    const arcSpan = Math.PI * 0.56;
    const startAngle = -Math.PI / 2 - arcSpan / 2;

    ctx.save();
    ctx.translate(cx, cy + faceWidthPx * 0.02);
    ctx.rotate(angle);

    ctx.strokeStyle = 'rgba(63,125,58,0.9)';
    ctx.lineWidth = Math.max(2, faceWidthPx * 0.02);
    ctx.beginPath();
    ctx.arc(0, 0, radius, startAngle, startAngle + arcSpan);
    ctx.stroke();

    ctx.font = `${fontSize}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    flowers.forEach((flower, i) => {
      const t = i / (flowers.length - 1);
      const a = startAngle + t * arcSpan;
      const fx = Math.cos(a) * radius;
      const fy = Math.sin(a) * radius;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(a + Math.PI / 2);
      ctx.fillText(flower, 0, 0);
      ctx.restore();
    });
    ctx.restore();
  }

  function crownLoop(now) {
    if (!crownEnabled || !currentStream) {
      crownRafId = null;
      return;
    }
    const ctx = crownCanvas.getContext('2d');
    ctx.clearRect(0, 0, crownCanvas.width, crownCanvas.height);
    try {
      const result = faceLandmarker.detectForVideo(video, now);
      lastFaceLandmarks = result.faceLandmarks && result.faceLandmarks.length ? result.faceLandmarks[0] : null;
      if (lastFaceLandmarks) {
        const lm = lastFaceLandmarks;
        const fit = getComputedStyle(video).objectFit;
        const { scale, offsetX, offsetY } = computeVideoMapping(
          crownCanvas.width,
          crownCanvas.height,
          video.videoWidth,
          video.videoHeight,
          fit
        );
        const toPoint = (p) => ({
          x: p.x * video.videoWidth * scale + offsetX,
          y: p.y * video.videoHeight * scale + offsetY
        });
        const forehead = toPoint(lm[10]);
        const leftEdge = toPoint(lm[234]);
        const rightEdge = toPoint(lm[454]);
        const leftEye = toPoint(lm[33]);
        const rightEye = toPoint(lm[263]);
        const faceWidthPx = Math.hypot(rightEdge.x - leftEdge.x, rightEdge.y - leftEdge.y);
        const angle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
        drawFlowerCrown(ctx, forehead.x, forehead.y, faceWidthPx, angle);
      }
    } catch (err) {
      // transient detection hiccups shouldn't kill the loop
    }
    crownRafId = requestAnimationFrame(crownLoop);
  }

  function stopCrownLoop() {
    if (crownRafId) {
      cancelAnimationFrame(crownRafId);
      crownRafId = null;
    }
    lastFaceLandmarks = null;
    crownCanvas.getContext('2d').clearRect(0, 0, crownCanvas.width, crownCanvas.height);
  }

  async function toggleCrown() {
    if (crownEnabled) {
      crownEnabled = false;
      crownBtn.classList.remove('active');
      stopCrownLoop();
      return;
    }
    crownBtn.disabled = true;
    setStatus('Loading face tracking… (first time may take a few seconds)');
    try {
      await ensureFaceLandmarker();
      crownEnabled = true;
      crownBtn.classList.add('active');
      resizeCrownCanvas();
      setStatus('Live');
      if (!crownRafId) crownRafId = requestAnimationFrame(crownLoop);
    } catch (err) {
      setStatus(`Flower crown unavailable: ${err.message}`, true);
    } finally {
      crownBtn.disabled = !currentStream;
    }
  }

  window.addEventListener('resize', () => {
    if (currentStream) resizeCrownCanvas();
  });

  function buildFilterCss() {
    const f = filterState;
    return `brightness(${f.brightness}%) contrast(${f.contrast}%) saturate(${f.saturate}%) hue-rotate(${f.hue}deg) grayscale(${f.grayscale}%) sepia(${f.sepia}%) invert(${f.invert}%)`;
  }

  function applyLiveTransforms() {
    video.style.filter = buildFilterCss();
    const mirror = video.classList.contains('mirror');
    const transform = `${mirror ? 'scaleX(-1) ' : ''}rotate(${rotation}deg)`;
    video.style.transform = transform;
    // the crown canvas draws in raw (unmirrored) video coordinate space, so it
    // needs the same mirror/rotation applied to line up with the display
    crownCanvas.style.transform = transform;
  }

  function refreshFilterUI() {
    brightnessSlider.value = filterState.brightness;
    contrastSlider.value = filterState.contrast;
    saturateSlider.value = filterState.saturate;
    hueSlider.value = filterState.hue;
    brightnessValue.textContent = filterState.brightness + '%';
    contrastValue.textContent = filterState.contrast + '%';
    saturateValue.textContent = filterState.saturate + '%';
    hueValue.textContent = filterState.hue + '°';
  }

  function onFilterSliderInput() {
    filterState.brightness = Number(brightnessSlider.value);
    filterState.contrast = Number(contrastSlider.value);
    filterState.saturate = Number(saturateSlider.value);
    filterState.hue = Number(hueSlider.value);
    brightnessValue.textContent = filterState.brightness + '%';
    contrastValue.textContent = filterState.contrast + '%';
    saturateValue.textContent = filterState.saturate + '%';
    hueValue.textContent = filterState.hue + '°';
    applyLiveTransforms();
  }

  function applyPreset(name) {
    const preset = FILTER_PRESETS[name];
    if (!preset) return;
    filterState = { ...preset };
    refreshFilterUI();
    applyLiveTransforms();
  }

  // draws a video frame onto a new canvas, applying mirror/rotation/filter
  // so snapshots and camera-mix captures match what's shown on screen
  function drawFrameToCanvas(sourceVideo, mirrored, rotationDeg, filterCss) {
    const vw = sourceVideo.videoWidth;
    const vh = sourceVideo.videoHeight;
    const swapped = rotationDeg === 90 || rotationDeg === 270;
    const canvas = document.createElement('canvas');
    canvas.width = swapped ? vh : vw;
    canvas.height = swapped ? vw : vh;
    const ctx = canvas.getContext('2d');
    if (filterCss) ctx.filter = filterCss;
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate((rotationDeg * Math.PI) / 180);
    if (mirrored) ctx.scale(-1, 1);
    ctx.drawImage(sourceVideo, -vw / 2, -vh / 2, vw, vh);

    if (crownEnabled && lastFaceLandmarks) {
      // draw in the same (still-mirrored/rotated) transform as the video frame,
      // using raw video-native coordinates so it lines up with the live overlay
      ctx.filter = 'none';
      const lm = lastFaceLandmarks;
      const toLocal = (p) => ({ x: p.x * vw - vw / 2, y: p.y * vh - vh / 2 });
      const forehead = toLocal(lm[10]);
      const leftEdge = toLocal(lm[234]);
      const rightEdge = toLocal(lm[454]);
      const leftEye = toLocal(lm[33]);
      const rightEye = toLocal(lm[263]);
      const faceWidthPx = Math.hypot(rightEdge.x - leftEdge.x, rightEdge.y - leftEdge.y);
      const faceAngle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
      drawFlowerCrown(ctx, forehead.x, forehead.y, faceWidthPx, faceAngle);
    }

    ctx.restore();
    return canvas;
  }

  function dataUrlToFile(dataUrl, filename) {
    const [header, base64] = dataUrl.split(',');
    const mime = (header.match(/data:(.*);base64/) || [, 'image/png'])[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new File([bytes], filename, { type: mime });
  }

  function downloadFile(file) {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // tries the native share sheet first (one tap -> "Save Image" -> Photos on iOS);
  // falls back to a plain download for browsers without file-sharing support
  async function shareOrDownload(files, title) {
    if (navigator.canShare && navigator.canShare({ files })) {
      try {
        await navigator.share({ files, title });
        return;
      } catch (err) {
        if (err.name === 'AbortError') return; // user dismissed the share sheet
      }
    }
    files.forEach((file, i) => setTimeout(() => downloadFile(file), i * 300));
  }

  function addSnapshot(dataUrl) {
    const img = document.createElement('img');
    img.src = dataUrl;
    img.title = new Date().toLocaleString();
    img.addEventListener('click', () => {
      const file = dataUrlToFile(dataUrl, `snapshot-${Date.now()}.png`);
      shareOrDownload([file], 'Camera Snapshot');
    });
    snapshotsEl.prepend(img);
  }

  async function enterFullscreenMode() {
    document.body.classList.add('fs-mode');
    if (stage.requestFullscreen) {
      try { await stage.requestFullscreen(); } catch (err) { /* fall back to CSS-only fullscreen */ }
    } else if (stage.webkitRequestFullscreen) {
      try { stage.webkitRequestFullscreen(); } catch (err) { /* fall back to CSS-only fullscreen */ }
    }
    if (currentStream) requestAnimationFrame(resizeCrownCanvas);
  }

  function exitFullscreenMode() {
    document.body.classList.remove('fs-mode');
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else if (document.webkitFullscreenElement) {
      document.webkitExitFullscreen();
    }
    if (currentStream) requestAnimationFrame(resizeCrownCanvas);
  }

  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) document.body.classList.remove('fs-mode');
    if (currentStream) requestAnimationFrame(resizeCrownCanvas);
  });

  function tickClock() {
    clockEl.textContent = new Date().toLocaleTimeString();
  }

  async function listCameras() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      cameraSelect.innerHTML = '';
      cams.forEach((cam, i) => {
        const opt = document.createElement('option');
        opt.value = cam.deviceId;
        opt.textContent = cam.label || `Camera ${i + 1}`;
        cameraSelect.appendChild(opt);
      });
      multipleCamerasAvailable = cams.length > 1;
      cameraSelect.disabled = !currentStream || !multipleCamerasAvailable;
      updateMixBtnState();
    } catch (err) {
      // enumeration can fail silently before permission is granted; not fatal
    }
  }

  async function startCamera(deviceId, facingMode) {
    stopCamera();
    setStatus('Requesting camera access…');
    try {
      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: facingMode || currentFacingMode },
        audio: false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;
      await video.play();

      // infer facing mode from the actual track when possible (deviceId-based
      // requests don't echo back the facingMode we asked for)
      const trackSettings = stream.getVideoTracks()[0]?.getSettings() || {};
      currentFacingMode = trackSettings.facingMode || facingMode || currentFacingMode;
      video.classList.toggle('mirror', currentFacingMode !== 'environment');
      applyLiveTransforms();

      setLiveUI(true);
      setStatus('Live');
      clockInterval = setInterval(tickClock, 1000);
      tickClock();
      await listCameras();
    } catch (err) {
      setLiveUI(false);
      if (err.name === 'NotAllowedError') {
        setStatus('Camera access denied. Allow camera permission and try again.', true);
      } else if (err.name === 'NotFoundError') {
        setStatus('No camera found on this device.', true);
      } else {
        setStatus(`Error: ${err.message}`, true);
      }
    }
  }

  function stopCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
      currentStream = null;
    }
    video.srcObject = null;
    if (clockInterval) {
      clearInterval(clockInterval);
      clockInterval = null;
    }
    setLiveUI(false);
    setStatus('Stopped');
  }

  function takeSnapshot() {
    if (!currentStream) return;
    const canvas = drawFrameToCanvas(video, video.classList.contains('mirror'), rotation, buildFilterCss());
    addSnapshot(canvas.toDataURL('image/png'));
  }

  function cycleRotation() {
    rotation = (rotation + 90) % 360;
    applyLiveTransforms();
  }

  function renderMixPreview() {
    if (!mixShots.front || !mixShots.back) return;
    const w = Math.max(mixShots.front.width, mixShots.back.width);
    const h = Math.max(mixShots.front.height, mixShots.back.height);
    mixCanvas.width = w;
    mixCanvas.height = h;
    const ctx = mixCanvas.getContext('2d');
    const layout = mixLayoutSelect.value;
    const blend = Number(mixBlendSlider.value) / 100;

    ctx.clearRect(0, 0, w, h);
    if (layout === 'sidebyside') {
      ctx.drawImage(mixShots.front, 0, 0, w / 2, h);
      ctx.drawImage(mixShots.back, w / 2, 0, w / 2, h);
    } else if (layout === 'pip') {
      ctx.drawImage(mixShots.back, 0, 0, w, h);
      const pipW = w * 0.32, pipH = h * 0.32, margin = w * 0.03;
      ctx.drawImage(mixShots.front, w - pipW - margin, h - pipH - margin, pipW, pipH);
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 3;
      ctx.strokeRect(w - pipW - margin, h - pipH - margin, pipW, pipH);
    } else {
      ctx.globalAlpha = 1 - blend;
      ctx.drawImage(mixShots.front, 0, 0, w, h);
      ctx.globalAlpha = blend;
      ctx.drawImage(mixShots.back, 0, 0, w, h);
      ctx.globalAlpha = 1;
    }
  }

  async function startMixFlow() {
    if (!currentStream || !multipleCamerasAvailable) return;
    mixOverlay.classList.remove('hidden');
    mixSaveBtn.style.display = 'none';
    mixLayoutSelect.style.display = 'none';
    mixBlendRow.style.display = 'none';
    mixCanvas.getContext('2d').clearRect(0, 0, mixCanvas.width, mixCanvas.height);
    mixShots = { front: null, back: null };

    const originalFacingMode = currentFacingMode;

    try {
      const firstLabel = currentFacingMode === 'environment' ? 'back' : 'front';
      mixStatus.textContent = `Capturing ${firstLabel} camera…`;
      const shot1 = drawFrameToCanvas(video, video.classList.contains('mirror'), rotation, buildFilterCss());
      const shot1Facing = currentFacingMode;

      const otherFacing = currentFacingMode === 'environment' ? 'user' : 'environment';
      const secondLabel = otherFacing === 'environment' ? 'back' : 'front';
      mixStatus.textContent = `Switching to ${secondLabel} camera…`;
      await startCamera(undefined, otherFacing);
      await new Promise((resolve) => setTimeout(resolve, 500));

      mixStatus.textContent = `Capturing ${secondLabel} camera…`;
      const shot2 = drawFrameToCanvas(video, video.classList.contains('mirror'), rotation, buildFilterCss());

      mixShots.front = shot1Facing === 'environment' ? shot2 : shot1;
      mixShots.back = shot1Facing === 'environment' ? shot1 : shot2;

      // restore whichever camera was active before the mix flow started
      await startCamera(undefined, originalFacingMode);

      mixStatus.textContent = 'Adjust the blend and layout, then save.';
      mixLayoutSelect.style.display = 'block';
      mixBlendRow.style.display = 'flex';
      mixSaveBtn.style.display = 'inline-block';
      renderMixPreview();
    } catch (err) {
      mixStatus.textContent = `Could not capture both cameras: ${err.message}`;
    }
  }

  startBtn.addEventListener('click', () => startCamera(cameraSelect.value || undefined));
  stopBtn.addEventListener('click', stopCamera);
  snapBtn.addEventListener('click', takeSnapshot);
  flipBtn.addEventListener('click', () => {
    currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
    startCamera(undefined, currentFacingMode);
  });
  cameraSelect.addEventListener('change', () => {
    if (currentStream) startCamera(cameraSelect.value);
  });
  fullscreenBtn.addEventListener('click', enterFullscreenMode);
  exitFsBtn.addEventListener('click', exitFullscreenMode);
  clearSnapsBtn.addEventListener('click', (e) => {
    e.preventDefault();
    snapshotsEl.innerHTML = '';
  });
  saveAllBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const imgs = Array.from(snapshotsEl.querySelectorAll('img'));
    if (!imgs.length) {
      setStatus('No snapshots to save yet.');
      return;
    }
    const files = imgs.map((img, i) => dataUrlToFile(img.src, `snapshot-${Date.now()}-${i}.png`));
    setStatus(`Saving ${files.length} photo${files.length > 1 ? 's' : ''}…`);
    shareOrDownload(files, 'Camera Snapshots');
  });

  rotateBtn.addEventListener('click', cycleRotation);
  adjustBtn.addEventListener('click', () => adjustPanel.classList.toggle('open'));
  resetFiltersBtn.addEventListener('click', () => applyPreset('normal'));
  [brightnessSlider, contrastSlider, saturateSlider, hueSlider].forEach((el) =>
    el.addEventListener('input', onFilterSliderInput)
  );
  document.querySelectorAll('#adjustPanel .preset-row button[data-preset]').forEach((btn) => {
    btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
  });

  crownBtn.addEventListener('click', toggleCrown);

  mixBtn.addEventListener('click', startMixFlow);
  mixCancelBtn.addEventListener('click', () => mixOverlay.classList.add('hidden'));
  mixLayoutSelect.addEventListener('change', renderMixPreview);
  mixBlendSlider.addEventListener('input', () => {
    mixBlendValue.textContent = mixBlendSlider.value + '%';
    renderMixPreview();
  });
  mixSaveBtn.addEventListener('click', () => {
    addSnapshot(mixCanvas.toDataURL('image/png'));
    mixOverlay.classList.add('hidden');
  });

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('Your browser does not support camera access.', true);
    startBtn.disabled = true;
  } else {
    listCameras();
  }
})();
</script>
</body>
</html>
